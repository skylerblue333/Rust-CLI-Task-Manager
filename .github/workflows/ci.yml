name: cli-task-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Format gate
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --all-targets --all-features
      - name: Release build
        run: cargo build --release --locked || (cargo generate-lockfile && cargo build --release --locked)
      - name: Dependency audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: CLI smoke test
        run: |
          tmp="$(mktemp)"
          rm -f "$tmp"
          export SKY_TASKS_FILE="$tmp"
          ./target/release/sky-tasks add verify-ci
          ./target/release/sky-tasks list | grep -q verify-ci
          ./target/release/sky-tasks complete 1
          ./target/release/sky-tasks list | grep -q '\[x\] #1 verify-ci'
      - name: Build image
        run: docker build -t sky-cli-tasks:ci .
      - name: Verify non-root image
        run: |
          user="$(docker image inspect sky-cli-tasks:ci --format '{{.Config.User}}')"
          test -n "$user"
          test "$user" != "0"
          test "$user" != "root"
