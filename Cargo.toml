[package]
name = "sky-cli-tasks"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Bounded local CLI task manager for the SKYCOIN4444 engineering lab"

[[bin]]
name = "sky-tasks"
path = "src/main.rs"

[lib]
name = "sky_cli_tasks"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
